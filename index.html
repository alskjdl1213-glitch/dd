<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
.wrap{max-width:680px;margin:auto;min-height:100vh;padding-bottom:30px}
header{padding:16px 18px;border-bottom:1px solid #272b35;position:sticky;top:0;background:#090b10;z-index:2}
.head{display:flex;justify-content:space-between;color:#aeb4c0;font-size:12px;letter-spacing:.08em}
.progress{height:4px;background:#272c38;border-radius:9px;margin-top:10px}.progress i{display:block;height:100%;width:20%;background:#ff5d87;border-radius:9px}
main{padding:18px}
.hero{border:1px solid #2b303b;border-radius:24px;padding:28px 18px;text-align:center;background:radial-gradient(circle at 50% 20%,#25202a,#10131a 62%);margin-bottom:18px}
.logo{font-size:70px;font-weight:1000;line-height:1;letter-spacing:-.08em}.logo b{color:#ff557f}.sub{color:#9da5b4;letter-spacing:.18em;font-size:11px;margin-top:10px}
.masc{width:62px;height:62px;object-fit:cover;border-radius:18px;background:#f59a57;border:2px solid #333;vertical-align:middle}
.talk{display:flex;gap:10px;align-items:center;margin:16px 0}.bubble{flex:1;background:#171b24;border:1px solid #303644;border-radius:16px;padding:13px;line-height:1.6;font-size:14px}
h1{font-size:25px;line-height:1.25;margin:10px 0 8px}.k{color:#ff6a91;font-size:11px;font-weight:900;letter-spacing:.12em}
.card{background:#151922;border:1px solid #2b303c;border-radius:18px;margin:11px 0;padding:14px;cursor:pointer}
.card:active{transform:scale(.99)}.title{display:flex;justify-content:space-between;gap:8px;align-items:center}.title strong{font-size:17px}.pill{font-size:10px;color:#ff88a6;border:1px solid #6d3044;padding:4px 7px;border-radius:99px}
.desc{color:#b5bbc7;font-size:12px;line-height:1.5;margin:8px 0}.route{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.info{background:#0d1016;border-radius:10px;padding:9px;font-size:10px;color:#8e97a7}.info b{display:block;color:#f2f4f8;font-size:12px;margin-top:3px}
.choice{color:#ff6a91;font-size:12px;font-weight:900;margin-top:11px}
button{width:100%;border:0;border-radius:15px;padding:15px;background:#ff5d87;color:white;font-weight:900;font-size:15px;margin-top:10px}button.alt{background:#252b37}
.note{color:#8e97a7;font-size:11px;line-height:1.6;margin-top:12px}
.food{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;background:#151922;border:1px solid #2b303c;border-radius:17px;padding:11px;margin:9px 0}
.food .emoji{width:58px;height:58px;border-radius:13px;background:#30252a;display:grid;place-items:center;font-size:30px}
.food h3{font-size:14px;margin:0 0 5px}.meta{color:#9da5b4;font-size:10px;line-height:1.5}.badge{margin-left:6px;background:#ff5d87;color:#fff;border-radius:99px;padding:3px 6px;font-size:9px}
</style>

function choosePlace(){setTop(2,"10/29 · 첫 목적지");let html='<div class="k">DAY 1 · 10월 29일</div><h1>상하이에 도착했습니다.</h1><div class="talk">'+face()+'<div class="bubble">호텔 체크인을 마쳤습니다.<br>첫 목적지를 선택합니다.</div></div>';for(const id of ["yu","nan","bund","xin"]){const p=places[id],r=(move.hotel[id]||["택시 정보 없음","대중교통 정보 없음"]);html+='<div class="card" onclick="pickPlace(\''+id+'\')"><div class="title"><strong>'+p.name+'</strong><span class="pill">'+p.area+'</span></div><div class="desc">'+p.desc+'</div><div class="route"><div class="info">🚕 택시 이동<b>'+r[0]+'</b></div><div class="info">🚇 대중교통 이동<b>'+r[1]+'</b></div><div class="info">⏱ 평균 체류<b>'+p.stay+'</b></div><div class="info">📍 이동 기준<b>호텔</b></div></div><div class="choice">이 장소를 선택합니다 →</div></div>'}app.innerHTML=html}
function pickPlace(id){pickedPlace=id;prev=id;setTop(3,"10/29 · 식사 선택");let html='<div class="k">CURRENT · '+places[id].name+'</div><h1>'+places[id].name+'을 둘러봤습니다.</h1><div class="talk">'+face()+'<div class="bubble">이제 식사할 곳을 선택합니다.</div></div>';foods.forEach((f,i)=>{html+='<div class="food" onclick="pickFood(\''+f[0]+'\')"><div class="emoji">'+f[2]+'</div><div><h3>'+f[0]+(i<2?'<span class="badge">추천</span>':'')+'</h3><div class="meta">'+f[1]+'<br>'+f[3]+'</div><div class="choice">이 식당으로 선택 →</div></div></div>'});app.innerHTML=html}
function pickFood(n){pickedFood=n;if(pickedPlace==="nan"||pickedPlace==="xin"){setTop(4,"10/29 · 쇼핑 선택");let html='<div class="k">'+places[pickedPlace].name+' · SHOPPING</div><h1>근처에서 기념품을 둘러봅니다.</h1><div class="talk">'+face()+'<div class="bubble">이 지역에서는 식사 후 쇼핑도 넣을 수 있습니다.</div></div>';shops.forEach(s=>{if((pickedPlace==="nan"&&s[0]!=="신천지 소품샵")||(pickedPlace==="xin"&&s[0]==="신천지 소품샵"))html+='<div class="food" onclick="pickShop(\''+s[0]+'\')"><div class="emoji">'+s[2]+'</div><div><h3>'+s[0]+'</h3><div class="meta">'+s[1]+'</div><div class="choice">여기 들르기 →</div></div></div>'});html+='<button class="alt" onclick="day2()">쇼핑 없이 다음 장소로 이동 →</button>';app.innerHTML=html}else day2()}
function pickShop(n){pickedShop=n;day2()}
function day2(){setTop(5,"10/30 · 다음 목적지");let html='<div class="k">DAY 2 · 10월 30일</div><h1>다음 목적지를 선택합니다.</h1><div class="talk">'+face()+'<div class="bubble">어제 선택한 장소를 기준으로 이동시간을 다시 계산합니다.</div></div>';for(const id of ["yu","nan","bund","xin"]){const p=places[id],r=(move[prev]&&move[prev][id])||move.hotel[id]||["약 20분","약 30분"];html+='<div class="card" onclick="route(\''+id+'\')"><div class="title"><strong>'+p.name+'</strong><span class="pill">'+p.area+'</span></div><div class="desc">'+p.desc+'</div><div class="route"><div class="info">🚕 택시 이동<b>'+r[0]+'</b></div><div class="info">🚇 대중교통 이동<b>'+r[1]+'</b></div><div class="info">⏱ 평균 체류<b>'+p.stay+'</b></div><div class="info">📍 이동 기준<b>'+places[prev].name+'</b></div></div><div class="choice">이 장소를 선택합니다 →</div></div>'}app.innerHTML=html}
function route(id){prev=id;setTop(6,"10/30 · 동선 확인");let r=(move[pickedPlace]&&move[pickedPlace][id])||move.hotel[id]||["약 20분","약 30분"];app.innerHTML='<div class="k">ROUTE CHECK</div><h1>'+places[id].name+'을 선택했습니다.</h1><div class="talk">'+face()+'<div class="bubble">이동시간과 평균 체류시간을 일정에 반영합니다.</div></div><div class="card"><div class="route"><div class="info">🚕 택시 이동<b>'+r[0]+'</b></div><div class="info">🚇 대중교통 이동<b>'+r[1]+'</b></div><div class="info">⏱ 평균 체류<b>'+places[id].stay+'</b></div><div class="info">📍 출발지<b>'+places[pickedPlace].name+'</b></div></div></div><button onclick="finish()">이 일정으로 선택 →</button>'}
function finish(){setTop(8,"FINAL · MY SHANGHAI");app.innerHTML='<section class="hero"><div class="logo">I<b>♥</b>SH</div><div class="sub">MY SHANGHAI ROUTE</div></section><div class="k">MY COURSE</div><h1>선택한 여행이 완성되었습니다.</h1><div class="card"><strong>10/29</strong><div class="desc">관광 · '+places[pickedPlace].name+'<br>식사 · '+pickedFood+'<br>쇼핑 · '+(pickedShop||"선택하지 않음")+'</div></div><div class="card"><strong>11/1 · 디즈니랜드</strong><div class="desc">Atour 체크아웃 → Novotel Shanghai Clover → 상하이 디즈니랜드 종일 → 호텔 복귀</div></div><div class="card"><strong>11/2 · 귀국</strong><div class="desc">아침 → 체크아웃·짐 보관 → 상하이 야생동물원 → 13:55 공항 이동 → 16:25 비행기</div></div><button onclick="start()">처음부터 다시 →</button>'}
start();
</script>
</body></html>
